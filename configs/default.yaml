# Default configuration for diffusion model training

experiment_name: diffusion_unleashed
run_name: test_mlflow
tags:
  experiment: simple unet diffusion
  dataset: cifar_10
  model: simple unet
  diffusion: ddpm
  date: 2026-08-01
# Model parameters
model:
  in_channels: 3
  out_channels: 3
  time_emb_dim: 128
  model_channels: 128
  channel_mult: [1, 2, 4, 8]
  attention_resolutions: [16]
  dropout: 0.1

# Diffusion parameters
diffusion:
  timesteps: 1000
  schedule_type: linear  # 'linear' or 'cosine'

# Data parameters
data:
  root_dir: /home/b629/Project/own_projects/cifar_10/cifar_10_images
  image_size: 64
  batch_size: 32
  num_workers: 4
  pin_memory: true
  val_split: 0.1

# Training parameters
training:
  num_epochs: 2
  learning_rate: 0.0001
  device: cuda  # 'cuda' or 'cpu'
  output_dir: outputs
  save_every: 10  # Save checkpoint every N epochs

# Sampling parameters (for inference)
sampling:
  num_samples: 16
  method: ddpm  # 'ddpm' or 'ddim'
  num_steps: 1000  # For DDPM, use full timesteps. For DDIM, can use fewer (e.g., 50)

