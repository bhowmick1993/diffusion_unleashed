# Default configuration for diffusion model training

# Model parameters
model:
  in_channels: 3
  out_channels: 3
  time_emb_dim: 128
  model_channels: 128
  channel_mult: [1, 2, 4, 8]
  attention_resolutions: [16]
  dropout: 0.1

# Diffusion parameters
diffusion:
  timesteps: 1000
  schedule_type: linear  # 'linear' or 'cosine'

# Data parameters
data:
  root_dir: C:\\AB_Personal\\diffusion_101\\CIFAR_10\\cifar-10-python\\cifar_10_images
  image_size: 64
  batch_size: 32
  num_workers: 4
  pin_memory: true

# Training parameters
training:
  num_epochs: 100
  learning_rate: 0.0001
  device: cpu  # 'cuda' or 'cpu'
  output_dir: outputs
  save_every: 10  # Save checkpoint every N epochs

# Sampling parameters (for inference)
sampling:
  num_samples: 16
  method: ddpm  # 'ddpm' or 'ddim'
  num_steps: 1000  # For DDPM, use full timesteps. For DDIM, can use fewer (e.g., 50)

